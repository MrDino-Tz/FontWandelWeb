<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="800" height="600" fill="#EBF0F6"/>
  <circle cx="90" cy="90" r="28" fill="#B3DBF0" opacity="0.5"/>
  <circle cx="710" cy="510" r="20" fill="#B3DBF0" opacity="0.4"/>

  <!-- Chart board -->
  <rect x="150" y="110" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#D8DEE7" stroke-width="4"/>
  <line x1="150" y1="176" x2="650" y2="176" stroke="#E9EDF3" stroke-width="4"/>
  <line x1="200" y1="430" x2="600" y2="430" stroke="#5B6472" stroke-width="7" stroke-linecap="round"/>

  <!-- Bars -->
  <g>
    <rect x="230" y="330" width="44" height="100" rx="8" fill="#B3DBF0"/>
    <rect x="300" y="290" width="44" height="140" rx="8" fill="#79C2E3"/>
    <rect x="370" y="320" width="44" height="110" rx="8" fill="#B3DBF0"/>
    <rect x="440" y="240" width="44" height="190" rx="8" fill="#1590C6"/>
    <rect x="510" y="270" width="44" height="160" rx="8" fill="#0C648F"/>
  </g>

  <!-- Trend line -->
  <polyline points="230,310 322,272 392,296 462,218 532,244" fill="none" stroke="#0C648F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="532" cy="244" r="12" fill="#0C648F" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Magnifier -->
  <circle cx="462" cy="218" r="72" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="462" cy="218" r="72" fill="none" stroke="#232A36" stroke-width="14"/>
  <line x1="513" y1="269" x2="566" y2="322" stroke="#232A36" stroke-width="20" stroke-linecap="round"/>

  <!-- Insight badge -->
  <circle cx="640" cy="140" r="40" fill="#0C648F"/>
  <path d="M622 140 l13 13 l26 -30" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
