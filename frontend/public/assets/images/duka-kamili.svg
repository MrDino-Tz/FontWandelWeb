  <!-- Receipt with paid check -->
  <rect x="500" y="110" width="150" height="200" fill="#FFFFFF" stroke="#5B6472" stroke-width="8"/>
  <polyline points="500,310 525,326 550,310 575,326 600,310 625,326 650,310" fill="#FFFFFF" stroke="#5B6472" stroke-width="8" stroke-linejoin="round"/>
  <line x1="522" y1="146" x2="628" y2="146" stroke="#B9C2CF" stroke-width="9" stroke-linecap="round"/>
  <line x1="522" y1="172" x2="628" y2="172" stroke="#B9C2CF" stroke-width="9" stroke-linecap="round"/>
  <line x1="522" y1="198" x2="596" y2="198" stroke="#B9C2CF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="575" cy="256" r="30" fill="#0C648F"/>
  <path d="M561 256 l10 10 l20 -22" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
