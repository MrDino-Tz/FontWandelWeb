<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#EBF0F6"/>
  <circle cx="96" cy="80" r="28" fill="#B3DBF0" opacity="0.5"/>
  <circle cx="716" cy="372" r="20" fill="#B3DBF0" opacity="0.4"/>

  <!-- Shop awning -->
  <g>
    <rect x="150" y="120" width="60" height="56" fill="#0C648F"/>
    <rect x="210" y="120" width="60" height="56" fill="#FFFFFF"/>
    <rect x="270" y="120" width="60" height="56" fill="#0C648F"/>
    <rect x="330" y="120" width="60" height="56" fill="#FFFFFF"/>
    <rect x="390" y="120" width="60" height="56" fill="#0C648F"/>
    <rect x="150" y="120" width="300" height="56" rx="12" fill="none" stroke="#0C648F" stroke-width="8"/>
    <line x1="150" y1="176" x2="450" y2="176" stroke="#0C648F" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Shop body -->
  <rect x="175" y="176" width="250" height="150" fill="#FFFFFF" stroke="#5B6472" stroke-width="8"/>
  <rect x="215" y="222" width="70" height="104" fill="#D9EDF8" stroke="#0C648F" stroke-width="7"/>
